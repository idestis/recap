version: '3'
tasks:
  install:
    desc: Install dependencies from the lockfile
    cmds:
      - npm ci
  dev:
    desc: Dev server
    cmds:
      - npm run dev
  build:
    desc: Production build into dist/
    cmds:
      - npm run build
  check:
    desc: Build, then enforce zero third-party requests and valid XML
    deps: [build]
    cmds:
      - xmllint --noout public/sitemap.xml public/logo.svg public/favicon.svg
      - |
        if grep -rnE 'src="(https?:)?//|href="http://|<script[^>]+src="(https?:)?//|<link[^>]+rel="stylesheet"[^>]+href="(https?:)?//|<iframe' --include='*.html' dist; then echo "FAIL: third-party or insecure reference in HTML"; exit 1; fi
      - |
        if grep -rnE 'url\(\s*["'"'"']?(https?:)?//|url\(http|@import url\(' --include='*.css' dist; then echo "FAIL: external reference in CSS"; exit 1; fi
      - echo "check ok"
