name: Labels

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Never checks out PR code: labels come from changed paths and the PR title.
  label:
    runs-on: ubuntu-24.04
    steps:
      - name: Area labels from paths
        uses: actions/labeler@v7
        with:
          sync-labels: true
      - name: Type label from the title
        uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            const m = title.match(/^(\w+)(\([^)]*\))?(!)?:/);
            const types = { feat: 'feature', fix: 'bug', perf: 'performance', refactor: 'refactor',
              docs: 'docs', test: 'test', build: 'build', ci: 'ci', chore: 'chore', style: 'chore', revert: 'revert' };
            const want = new Set();
            if (m && types[m[1]]) want.add(types[m[1]]);
            if (m && m[3]) want.add('breaking');
            const managed = new Set([...Object.values(types), 'breaking']);
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const current = context.payload.pull_request.labels.map(l => l.name);
            for (const name of current) {
              if (managed.has(name) && !want.has(name)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              }
            }
            const add = [...want].filter(n => !current.includes(n));
            if (add.length) await github.rest.issues.addLabels({ owner, repo, issue_number, labels: add });
